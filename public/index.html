<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sounding Room</title>
<style>
  :root { --bg: #f7f5f0; --fg: #1d1d1b; --muted: #6b675f; }
  @media (prefers-color-scheme: dark) { :root { --bg: #151513; --fg: #ecebe6; --muted: #9b978e; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font: 16px/1.5 system-ui, sans-serif; padding: 0 16px; }
  main { max-width: 34rem; }
  h1 { margin: 0 0 .5rem; font-size: 2rem; }
  p { margin: .25rem 0; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Sounding Room</h1>
  <p>Interpret Vertical Electrical Soundings in the browser.</p>
  <p>Coming soon. Built with Kiro for Kiroween 2026.</p>
</main>
</body>
</html>
